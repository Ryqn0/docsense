[project]
name = "docsense"
version = "0.1.0"
description = "Multi-tenant Document Q&A Platform with Feedback Loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "openai>=2.37.0",
    "prometheus-client>=0.25.0",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "qdrant-client==1.18.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "streamlit>=1.57.0",
    "structlog>=25.5.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.46.0",
] # Empty for now and completed by phase

[tool.ruff]
# ruff is a linter + formatter tool
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # E=pycodestyle, F=pyflakes, I=isort

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
