apiVersion: v1
kind: Service
metadata:
  name: postgres          # this becomes the DNS name: postgres.docsense.svc.cluster.local
  namespace: docsense
spec:
  selector:
    app: postgres         # route traffic to pods with this label
  ports:
    - port: 5432          # the port the Service listens on
      targetPort: 5432    # the port on the pod to forward to
  type: ClusterIP         # internal only - not accessible from outside the cluster
