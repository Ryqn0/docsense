apiVersion: v1
kind: Secret
metadata:
  name: docsense-secrets
  namespace: docsense
type: Opaque
stringData:
  # stringData accepts plain text - K8s base64-encodes automatically
  POSTGRES_USER: docsense
  POSTGRES_PASSWORD: docsense_dev_password
  POSTGRES_DB: docsense
  DATABASE_URL: postgresql+asyncpg://docsense:docsense_dev_password@postgres:5432/docsense
  OPENAI_API_KEY: "REPLACE_WITH_REAL_KEY"
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
