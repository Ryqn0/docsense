apiVersion: v1
kind: ConfigMap
metadata:
  name: docsense-config
  namespace: docsense
data:
  # Non-sensitive config - safe to store in plain text
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  ENVIRONMENT: "production"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIMENSION: "1536"
  LLM_MODEL: "gpt-4o-mini"
  UPLOAD_DIR: "tmp/docsense_uploads"
  EVAL_SET_PATH: "data/eval_sets/goldent_set.json"
