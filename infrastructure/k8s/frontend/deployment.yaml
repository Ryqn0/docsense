apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docsense-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://api:8000"
